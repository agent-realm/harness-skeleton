<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 604" width="880" height="604" role="img" aria-labelledby="title desc">
<title id="title">harness-skeleton: configuration goes in, state comes out</title>
<desc id="desc">Your tool hands hs a spec. hs validates and plans it, the user approves it with a receipt, and hs delivers it to the harness, either at launch or into the data folder's config files. In the other direction hs reads the folder's state and sessions, and never writes them. hs has drivers for Claude Code and Codex; OpenCode and pi are designed, with no driver yet.</desc>
<style>
:root { --bg:#f6f7f9; --card:#ffffff; --ink:#1b2230; --muted:#5a6475; --line:#c5cbd6;
  --cfg:#2a55c9; --cfg-t:#e9effd; --st:#a3520a; --st-t:#fcf0e2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#10151c; --card:#171d26; --ink:#e3e7ee; --muted:#9ba5b5; --line:#3a4454;
    --cfg:#86a7ff; --cfg-t:#1a2646; --st:#f0a55a; --st-t:#33250f; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
.h { font-size: 15px; font-weight: 600; }
.b { font-size: 14px; font-weight: 600; }
.s { font-size: 12px; fill: var(--muted); }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.c-cfg { fill: var(--cfg); }
.c-st { fill: var(--st); }
.bg { fill: var(--bg); }
.card { fill: var(--card); stroke: var(--line); }
.chip { fill: var(--bg); stroke: var(--line); }
.box-cfg { fill: var(--cfg-t); stroke: var(--cfg); }
.box-st { fill: var(--st-t); stroke: var(--st); }
.dash { stroke-dasharray: 5 4; }
.rule { stroke: var(--line); }
.ar-cfg { stroke: var(--cfg); stroke-width: 2; fill: none; }
.ar-st { stroke: var(--st); stroke-width: 2; fill: none; }
.mk-cfg { fill: var(--cfg); }
.mk-st { fill: var(--st); }
</style>
<defs>
  <marker id="a-cfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-cfg"/></marker>
  <marker id="a-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-st"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="604" rx="12"/>

<!-- lane labels -->
<line class="rule" x1="136" y1="24" x2="136" y2="544"/>
<text class="h" x="24" y="48">Your side</text>
<text class="h" x="24" y="218">hs</text>
<text class="s" x="24" y="238">the reference</text>
<text class="s" x="24" y="254">adapter</text>
<text class="h" x="24" y="436">The harness</text>
<rect class="chip" x="24" y="448" width="100" height="20" rx="10"/>
<text class="s" x="74" y="462" text-anchor="middle">Claude Code</text>
<rect class="chip" x="24" y="474" width="100" height="20" rx="10"/>
<text class="s" x="74" y="488" text-anchor="middle">Codex</text>
<rect class="chip dash" x="24" y="500" width="100" height="20" rx="10"/>
<text class="s" x="74" y="514" text-anchor="middle">OpenCode</text>
<rect class="chip dash" x="24" y="526" width="100" height="20" rx="10"/>
<text class="s" x="74" y="540" text-anchor="middle">pi</text>

<!-- your side -->
<rect class="card" x="148" y="24" width="224" height="124" rx="8"/>
<text class="h" x="164" y="48">The spec</text>
<text class="s" x="164" y="66">layers, lowest first</text>
<rect class="chip" x="164" y="76" width="192" height="18" rx="4"/>
<text class="s" x="174" y="89">organisation layer</text>
<rect class="chip" x="164" y="98" width="192" height="18" rx="4"/>
<text class="s" x="174" y="111">team layer</text>
<rect class="chip" x="164" y="120" width="192" height="18" rx="4"/>
<text x="174" y="133"><tspan class="m">local.toml</tspan><tspan class="s"> · this machine</tspan></text>

<rect class="card" x="388" y="24" width="224" height="124" rx="8"/>
<text class="h" x="404" y="48">The user</text>
<text x="404" y="74">approves what hs will do:</text>
<text x="404" y="92">a receipt bound to the</text>
<text x="404" y="110">digest of one plan or launch</text>

<rect class="card" x="628" y="24" width="228" height="124" rx="8"/>
<text class="h" x="644" y="48">Your tool</text>
<text x="644" y="74">a config builder, a status</text>
<text x="644" y="92">line host, a fleet launcher,</text>
<text x="644" y="110">a session archive</text>

<path class="ar-cfg" d="M260 148V195" marker-end="url(#a-cfg)"/>
<text class="s" x="268" y="176">resolve</text>
<path class="ar-cfg" d="M440 148V195" marker-end="url(#a-cfg)"/>
<text class="s" x="448" y="176">receipt</text>
<path class="ar-st" d="M742 196V149" marker-end="url(#a-st)"/>
<text class="s" x="734" y="176" text-anchor="end">records, drift, state inventory</text>

<!-- hs -->
<rect class="box-cfg" x="148" y="196" width="344" height="120" rx="8"/>
<text class="b c-cfg" x="164" y="220">Configure</text>
<text class="m" x="164" y="244">validate · plan · apply</text>
<text class="m" x="164" y="262">remove · recover · launch-spec</text>
<text class="s" x="164" y="300">writes config and its own records, never state</text>

<rect class="box-st" x="508" y="196" width="348" height="120" rx="8"/>
<text class="b c-st" x="524" y="220">Read</text>
<text class="m" x="524" y="244">describe · detect · observe</text>
<text class="m" x="524" y="262">sessions.list · sessions.read</text>
<text class="m" x="524" y="280">sessions.derive</text>
<text class="s" x="524" y="300">writes nothing; sessions for 12 harnesses</text>

<path class="ar-cfg" d="M258 316V419" marker-end="url(#a-cfg)"/>
<text class="m" x="266" y="372">launch-spec</text>
<path class="ar-cfg" d="M440 316V419" marker-end="url(#a-cfg)"/>
<text class="m" x="448" y="372">apply</text>
<path class="ar-st" d="M580 420V317" marker-end="url(#a-st)"/>
<text class="s" x="588" y="372">observe: drift</text>
<path class="ar-st" d="M716 420V317" marker-end="url(#a-st)"/>
<text class="m" x="724" y="364">observe --state</text>
<text class="m" x="724" y="382">sessions.*</text>

<!-- the harness -->
<rect class="box-cfg" x="148" y="420" width="220" height="124" rx="8"/>
<text class="b c-cfg" x="164" y="444">At launch</text>
<text x="164" y="468">argv, environment and</text>
<text x="164" y="486">files in a temp dir</text>
<text x="164" y="512"><tspan class="s">mode: </tspan><tspan class="m">overlay</tspan></text>

<rect class="box-cfg" x="384" y="420" width="236" height="124" rx="8"/>
<text class="b c-cfg" x="400" y="444">Config files</text>
<text x="400" y="468">settings, MCP, hooks, skills:</text>
<text x="400" y="486">managed keys only</text>
<text x="400" y="512"><tspan class="s">mode: </tspan><tspan class="m">materialize</tspan></text>
<text x="400" y="530"><tspan class="m">reconcile</tspan><tspan class="s"> is designed</tspan></text>

<rect class="box-st" x="636" y="420" width="220" height="124" rx="8"/>
<text class="b c-st" x="652" y="444">State</text>
<text x="652" y="468">sessions, history,</text>
<text x="652" y="486">credentials, caches</text>
<text class="s" x="652" y="512">the harness writes it,</text>
<text class="s" x="652" y="530">hs only reads it</text>

<!-- legend -->
<path class="ar-cfg" d="M148 582H180" marker-end="url(#a-cfg)"/>
<text class="s" x="190" y="586">configuration going in</text>
<path class="ar-st" d="M380 582H412" marker-end="url(#a-st)"/>
<text class="s" x="422" y="586">state coming out, read only</text>
<rect class="chip dash" x="640" y="574" width="28" height="16" rx="8"/>
<text class="s" x="678" y="586">designed, not built yet</text>
</svg>
