<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" role="img" aria-labelledby="title desc">
<title id="title">Reading sessions</title>
<desc id="desc">hs answers sessions.list, sessions.read and sessions.derive through the session adapters package, which reads twelve harnesses' stores without writing them. read returns raw units from a position; derive is pure and turns units into records. The consumer keeps cursors, generations, revisions and its archive, and passes the position back on the next read.</desc>
<style>
:root { --bg:#f6f7f9; --card:#ffffff; --ink:#1b2230; --muted:#5a6475; --line:#c5cbd6;
  --st:#a3520a; --st-t:#fcf0e2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#10151c; --card:#171d26; --ink:#e3e7ee; --muted:#9ba5b5; --line:#3a4454;
    --st:#f0a55a; --st-t:#33250f; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--ink); }
.b { font-size: 14px; font-weight: 600; }
.s { fill: var(--muted); }
.mb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.c-st { fill: var(--st); }
.bg { fill: var(--bg); }
.card { fill: var(--card); stroke: var(--line); }
.chip { fill: var(--bg); stroke: var(--line); }
.box-st { fill: var(--st-t); stroke: var(--st); }
.rule { stroke: var(--line); fill: none; }
.ar-st { stroke: var(--st); stroke-width: 2; fill: none; }
.ar-ink { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.mk-st { fill: var(--st); }
.mk-ink { fill: var(--muted); }
</style>
<defs>
  <marker id="a-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-st"/></marker>
  <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk-ink"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="880" height="308" rx="12"/>

<text class="s" x="439" y="24" text-anchor="middle">hs operations, answered by the session adapters package</text>
<path class="rule" d="M195 40V34H684V40"/>

<rect class="box-st" x="24" y="56" width="147" height="104" rx="8"/>
<text class="b c-st" x="38" y="80">Harness store</text>
<text class="s" x="38" y="100">files or SQLite,</text>
<text class="s" x="38" y="116">12 harnesses</text>
<text class="s" x="38" y="144">opened read-only</text>

<rect class="card" x="195" y="56" width="147" height="104" rx="8"/>
<text class="mb" x="209" y="80">sessions.list</text>
<text class="s" x="209" y="100">each session's key,</text>
<text class="s" x="209" y="116">sources, live,</text>
<text class="m" x="209" y="132">updated_hint</text>

<rect class="card" x="366" y="56" width="147" height="104" rx="8"/>
<text class="mb" x="380" y="80">sessions.read</text>
<text class="s" x="380" y="100">from a position:</text>
<text class="s" x="380" y="116">raw units, gone,</text>
<text class="s" x="380" y="132">continuity,</text>
<text class="s" x="380" y="148">a new position</text>

<rect class="card" x="537" y="56" width="147" height="104" rx="8"/>
<text class="mb" x="551" y="80">sessions.derive</text>
<text class="s" x="551" y="100">pure: units and</text>
<text class="s" x="551" y="116">state in, changed</text>
<text class="s" x="551" y="132">records out</text>

<rect class="card" x="708" y="56" width="148" height="104" rx="8"/>
<text class="b" x="722" y="80">Your consumer</text>
<text class="s" x="722" y="100">keeps cursors,</text>
<text class="s" x="722" y="116">generations, rev</text>
<text class="s" x="722" y="132">and its archive</text>

<path class="ar-st" d="M171 108H194" marker-end="url(#a-st)"/>
<path class="ar-st" d="M342 108H365" marker-end="url(#a-st)"/>
<path class="ar-st" d="M513 108H536" marker-end="url(#a-st)"/>
<path class="ar-st" d="M684 108H707" marker-end="url(#a-st)"/>
<path class="ar-ink" d="M782 160V196H439V161" marker-end="url(#a-ink)"/>
<text class="s" x="610" y="190" text-anchor="middle">the position, next time</text>

<rect class="card" x="24" y="224" width="832" height="64" rx="8"/>
<text class="b" x="40" y="261">Records</text>
<rect class="chip" x="112" y="245" width="70" height="22" rx="4"/>
<text class="m" x="147" y="260" text-anchor="middle">session</text>
<rect class="chip" x="190" y="245" width="74" height="22" rx="4"/>
<text class="m" x="227" y="260" text-anchor="middle">message</text>
<rect class="chip" x="272" y="245" width="58" height="22" rx="4"/>
<text class="m" x="301" y="260" text-anchor="middle">usage</text>
<rect class="chip" x="338" y="245" width="46" height="22" rx="4"/>
<text class="m" x="361" y="260" text-anchor="middle">link</text>
<rect class="chip" x="392" y="245" width="84" height="22" rx="4"/>
<text class="m" x="434" y="260" text-anchor="middle">lifecycle</text>
<text class="s" x="496" y="252">records and keys: the sessions-model contract</text>
<text class="s" x="496" y="270">the four operations: the sessions contract</text>
</svg>
