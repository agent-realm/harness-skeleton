[spec]
name = "kit"
version = "1.0.0"
format = "0.2"

# Persisted as opencode.json's model, so a bare start uses it: OpenCode names a model provider/model.
[model.roles]
primary = "openai/gpt-x"

# A stdio server in this layer, persisted by copy into the folder's hs-run/.
[mcp.notes]
exec = "node"
args = ["servers/notes.mjs"]
self_contained = true
